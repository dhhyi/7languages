# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  build:
    root:
      - RUN mise use -g java
      - RUN mise use -g clojure
      - ADD https://raw.githubusercontent.com/clojure-lsp/clojure-lsp/master/install /tmp/install-clojure-lsp.sh
      - RUN bash /tmp/install-clojure-lsp.sh
      - RUN echo > /conda-notice.txt
  selftest: clojure -M -e '(println "Hello World!")'
vscode:
  settings:
    files.watcherExclude:
      "**/target": true
  extensions:
    - betterthantomorrow.calva
