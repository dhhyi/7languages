# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  build:
    packages:
      - cmake
      - timidity
      - fluid-soundfont-gm
      - build-essential
    user:
      - RUN mise use -g lua
      - RUN luarocks install busted
        && luarocks install --server=https://luarocks.org/dev luaformatter
        && luarocks install luacheck
    root:
      - RUN git clone https://github.com/craigsapp/midifile /tmp/midifile
      - RUN cd /tmp/midifile && make library
      - RUN mkdir -p /usr/include/midifile && cp -Rfv /tmp/midifile/include/*.h /usr/include/midifile
      - RUN mkdir -p /usr/lib/midifile && cp -Rfv /tmp/midifile/lib/*.a /usr/lib/
vscode:
  settings:
    cmake.configureOnOpen: false
    files.associations:
      ostream: cpp
  extensions:
    - ms-vscode.cpptools-extension-pack
