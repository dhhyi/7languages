# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  build:
    root:
      - RUN mise use -g java
      - RUN mise use -g clojure
  selftest: |
    cat >/tmp/helloworld.clj <<EOF
    (use 'clojure.core.logic)
    (println (run* [q] (== q "Hello World!")))
    EOF
    clojure -Sdeps '{:deps {org.clojure/core.logic {:mvn/version "1.0.1"}}}' -M /tmp/helloworld.clj
